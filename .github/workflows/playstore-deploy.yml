name: Play Store Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Signing Config
        run: |
          # สร้างไฟล์ key.properties ในโฟลเดอร์ renaart/android/
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > renaart/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> renaart/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> renaart/android/key.properties
          echo "storeFile=app/upload-keystore.jks" >> renaart/android/key.properties
          
          # Decode ไฟล์กุญแจไปไว้ในโฟลเดอร์ renaart/android/app/
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > renaart/android/app/upload-keystore.jks

      - name: Build App Bundle
        run: |
          cd renaart
          flutter pub get
          flutter build appbundle --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: renaart/build/app/outputs/bundle/release/app-release.aab