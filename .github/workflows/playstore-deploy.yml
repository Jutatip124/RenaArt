name: Deploy Android to Play Store

on:
  push:
    tags:
      - 'v*'          # Trigger only on version tags: v1.0.0, v1.1.0, …
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Setup Java (required for Android Gradle build) ────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Setup Flutter (latest stable) ─────────────────────────────────────
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── 4. Restore keystore from secret (NEVER stored in repo) ───────────────
      #       In GitHub: Settings → Secrets → KEYSTORE_BASE64
      #       Generate with: base64 -w 0 renaart-release.jks | pbcopy
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > renaart/renaart-release.jks

      # ── 5. Write key.properties from secrets (never committed to repo) ────────
      - name: Write key.properties
        run: |
          cat > renaart/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../renaart-release.jks
          EOF

      # ── 6. Install Flutter dependencies ──────────────────────────────────────
      - name: Install dependencies
        working-directory: renaart
        run: flutter pub get

      # ── 6.5. Create dummy .env file ─────────────────────────────────────────
      - name: Create dummy .env file
        working-directory: renaart
        run: touch .env

      # ── 6.6 Generate firebase_options.dart from secrets ────────────────────
      - name: Generate Firebase Options
        working-directory: renaart
        run: |
          cat > lib/firebase_options.dart << 'FIREBASE_EOF'
          // File generated by CI from GitHub Secrets
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart'
              show defaultTargetPlatform, kIsWeb, TargetPlatform;
          
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) {
                return web;
              }
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                case TargetPlatform.macOS:
                case TargetPlatform.windows:
                case TargetPlatform.linux:
                  throw UnsupportedError(
                    'DefaultFirebaseOptions have not been configured for this platform.',
                  );
                default:
                  throw UnsupportedError(
                    'DefaultFirebaseOptions are not supported for this platform.',
                  );
              }
            }
          
            static const FirebaseOptions web = FirebaseOptions(
              apiKey: '${{ secrets.FIREBASE_WEB_API_KEY }}',
              appId: '${{ secrets.FIREBASE_WEB_APP_ID }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              authDomain: '${{ secrets.FIREBASE_AUTH_DOMAIN }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
              measurementId: '${{ secrets.FIREBASE_MEASUREMENT_ID }}',
            );
          
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: '${{ secrets.FIREBASE_ANDROID_API_KEY }}',
              appId: '${{ secrets.FIREBASE_ANDROID_APP_ID }}',
              messagingSenderId: '${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}',
              projectId: '${{ secrets.FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ secrets.FIREBASE_STORAGE_BUCKET }}',
            );
          }
          FIREBASE_EOF

      # ── 6.7 Generate google-services.json from secrets ─────────────────────
      - name: Generate google-services.json
        working-directory: renaart
        run: |
          cat > android/app/google-services.json << EOF
          {
            "project_info": {
              "project_number": "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
              "project_id": "${{ secrets.FIREBASE_PROJECT_ID }}",
              "storage_bucket": "${{ secrets.FIREBASE_STORAGE_BUCKET }}"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "${{ secrets.FIREBASE_ANDROID_APP_ID }}",
                  "android_client_info": {
                    "package_name": "com.renaart.app"
                  }
                },
                "api_key": [
                  {
                    "current_key": "${{ secrets.FIREBASE_ANDROID_API_KEY }}"
                  }
                ]
              }
            ]
          }
          EOF

      # ── 7. Analyze ───────────────────────────────────────────────────────────
      - name: Analyze
        working-directory: renaart
        run: flutter analyze --no-fatal-infos

      # ── 8. Run tests ─────────────────────────────────────────────────────────
      - name: Run tests
        working-directory: renaart
        run: flutter test

      # ── 9. Build Android App Bundle (AAB) ────────────────────────────────────
      #       AAB is required by Google Play (not APK)
      - name: Build AAB
        working-directory: renaart
        run: flutter build appbundle --release

      # ── 10. Upload to Play Store (internal track) ─────────────────────────────
      #       Promote to alpha → beta → production manually in Play Console
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          packageName: com.renaart.app
          releaseFiles: renaart/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew   # optional release notes

      # ── 11. Clean up keystore (never leave on runner) ─────────────────────────
      - name: Remove keystore
        if: always()
        run: rm -f renaart/renaart-release.jks renaart/android/key.properties
