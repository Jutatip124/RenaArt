name: Play Store Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Signing Config
        run: |
          # 1. ตรวจสอบและสร้างโฟลเดอร์ให้ชัวร์ก่อน
          mkdir -p renaart/android/app

          # 2. สร้างไฟล์ key.properties เข้าไปในโฟลเดอร์ android ของโปรเจกต์โดยตรง
          # ใช้เครื่องหมาย > เพื่อสร้างไฟล์ใหม่ และ >> เพื่อต่อท้าย
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > renaart/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> renaart/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> renaart/android/key.properties
          echo "storeFile=app/upload-keystore.jks" >> renaart/android/key.properties
          
          # 3. วางไฟล์กุญแจ .jks ไว้ในโฟลเดอร์ app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > renaart/android/app/upload-keystore.jks

      - name: Create Dummy Firebase Options
        run: |
          mkdir -p renaart/lib
          cat <<EOF > renaart/lib/firebase_options.dart
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, kIsWeb, TargetPlatform;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'dummy',
              appId: 'dummy',
              messagingSenderId: 'dummy',
              projectId: 'dummy',
              storageBucket: 'dummy',
            );
          }
          EOF

      - name: Build App Bundle
        run: |
          # เข้าไปในโฟลเดอร์โปรเจกต์ก่อนเริ่มงาน
          cd renaart
          flutter pub get
          # รันคำสั่ง Build พร้อม flag ข้ามการตรวจเวอร์ชันเพื่อความราบรื่น
          flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: renaart/build/app/outputs/bundle/release/app-release.aab