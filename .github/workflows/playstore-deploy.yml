name: Play Store Build

on:
  push:
    branches: [ main ] # สั่งให้ Build ทุกครั้งที่ Push โค้ดลง branch main
  workflow_dispatch: # ปุ่มกดสั่ง Build เองได้จากหน้าเว็บ GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Signing Config
        run: |
          # สร้างไฟล์ key.properties (ใช้ Path ตรงตามที่ Gradle ต้องการ)
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=app/upload-keystore.jks" >> android/key.properties
          
          # แปลง Base64 กลับเป็นไฟล์กุญแจจริง
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Build App Bundle
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: build/app/outputs/bundle/release/app-release.aab